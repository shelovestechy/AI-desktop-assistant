[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-desktop-assistant"
version = "0.1.0"
description = "A privacy-first AI desktop assistant for Windows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PyQt6>=6.7,<7",
  "psutil>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[project.scripts]
ai-desktop-assistant = "assistant_app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
